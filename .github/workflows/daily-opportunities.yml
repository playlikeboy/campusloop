name: Daily student opportunities

on:
  schedule:
    # 08:00 Asia/Kolkata (02:30 UTC)
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusloop-daily-opportunities
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check configuration
        env:
          CAMPUSLOOP_MCP_API_KEY: ${{ secrets.CAMPUSLOOP_MCP_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          if [ -z "$CAMPUSLOOP_MCP_API_KEY" ]; then
            echo "::error::Configure CAMPUSLOOP_MCP_API_KEY in repository Actions secrets."
            exit 1
          fi
          if [ -z "$SERPAPI_API_KEY" ]; then
            echo "::error::Configure SERPAPI_API_KEY in repository Actions secrets."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Discover, verify, deduplicate and publish
        env:
          CAMPUSLOOP_MCP_URL: https://campusloop.space/mcp/events
          CAMPUSLOOP_MCP_API_KEY: ${{ secrets.CAMPUSLOOP_MCP_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: node scripts/opportunities/daily-search.mjs

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campusloop-opportunity-report
          path: opportunity-report.md
          if-no-files-found: ignore
          retention-days: 30
