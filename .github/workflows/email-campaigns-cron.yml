name: Email campaigns

on:
  schedule:
    # Every 5 minutes (the GitHub minimum). The endpoint sends up to 4 batches of 50 per run
    # and returns at once when no campaign is queued.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusloop-email-campaigns-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check configuration
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure CRON_SECRET in repository Actions secrets."
            exit 1
          fi

      - name: Call POST /api/cron/email-campaigns
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST "https://campusloop.space/api/cron/email-campaigns" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
