name: One-time canonical route cleanup

on:
  push:
    branches: [main]

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[route-cleanup]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rewrite URL-style app paths
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path

          route_re = re.compile(r'(?<![A-Za-z0-9_@])/app(?:/[^\'"\x60<>\\s]*)?')
          feed_re = re.compile(r'(?<![A-Za-z0-9_])/feed(?=(?:[/?#\'"\x60)]|\s|$))')
          chats_re = re.compile(r'(?<![A-Za-z0-9_])/chats(?=(?:[/?#\'"\x60)]|\s|$))')

          tracked = subprocess.check_output(['git', 'ls-files', '-z'], text=False).decode().split('\0')
          binary_exts = {'.png','.jpg','.jpeg','.gif','.webp','.ico','.pdf','.zip','.woff','.woff2','.ttf','.otf','.mp4','.mov','.mp3'}

          def canonical(m):
              value = m.group(0)
              if value == '/app':
                  return '/feeds'
              if value.startswith('/app/chats'):
                  return '/chat' + value[len('/app/chats'):]
              return value[4:] or '/feeds'

          for rel in tracked:
              if not rel or rel.startswith('.git/') or rel == '.github/workflows/one-time-route-cleanup.yml':
                  continue
              if Path(rel).suffix.lower() in binary_exts:
                  continue
              path = Path(rel)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              new = route_re.sub(canonical, text)
              new = feed_re.sub('/feeds', new)
              new = chats_re.sub('/chat', new)

              if new != text:
                  path.write_text(new, encoding='utf-8')

      - name: Remove this one-time workflow
        run: rm -f .github/workflows/one-time-route-cleanup.yml

      - name: Commit canonical route cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes needed."
            exit 0
          fi
          git commit -m "fix(routing): remove stale app URL references [route-cleanup-done]"
          git push
