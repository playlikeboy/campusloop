name: Android beta APK

# Builds the Expo app in apps/mobile into a signed release APK and publishes it
# to the GitHub Release tagged `beta`, so this URL always serves the newest build:
#   https://github.com/playlikeboy/campusloop/releases/download/beta/campusloop-beta.apk
#
# Signing secrets (all four, or none):
#   ANDROID_KEYSTORE_BASE64    base64 of the PKCS12 upload keystore
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias ("campusloop")
#   ANDROID_KEY_PASSWORD       key password
# Without them the APK is signed with the debug keystore that prebuild generates.
# That APK installs fine, but a later build signed with the real key cannot update it in place.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      CAMPUSLOOP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CAMPUSLOOP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CAMPUSLOOP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: "1"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$CAMPUSLOOP_KEYSTORE_PASSWORD" ] && [ -n "$CAMPUSLOOP_KEY_ALIAS" ] && [ -n "$CAMPUSLOOP_KEY_PASSWORD" ]; then
            keystore="$RUNNER_TEMP/campusloop-upload.p12"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "CAMPUSLOOP_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
            echo "Release build will be signed with the upload keystore."
          else
            echo "::warning title=Debug-signed APK::ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS or ANDROID_KEY_PASSWORD is missing, so this APK is signed with the debug keystore. Add all four secrets to sign with the release key."
          fi

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/campusloop-beta.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify --print-certs "$GITHUB_WORKSPACE/campusloop-beta.apk" | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          ls -lh "$GITHUB_WORKSPACE/campusloop-beta.apk"

      - name: Keep APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusloop-beta-${{ github.run_number }}
          path: campusloop-beta.apk
          retention-days: 14

      - name: Publish to the beta release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Android beta build ${{ github.run_number }} from ${GITHUB_SHA::7}. Download campusloop-beta.apk below and open it on your phone to install."
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --target "$GITHUB_SHA" --title "CampusLoop Android beta" --notes "$notes" --latest
          fi
          gh release edit beta --title "CampusLoop Android beta" --notes "$notes" --prerelease=false --latest
          gh release upload beta campusloop-beta.apk --clobber
