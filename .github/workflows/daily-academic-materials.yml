name: Daily Academic Materials

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusloop-daily-academic-materials
  cancel-in-progress: false

jobs:
  index-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAMPUSLOOP_ACADEMICS_MCP_URL: https://campusloop.space/mcp/academics
      CAMPUSLOOP_ACADEMICS_MCP_API_KEY: ${{ secrets.CAMPUSLOOP_ACADEMICS_MCP_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      MAX_NEW_PER_RUN: "5"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate runner syntax
        run: node --check scripts/academics/daily-materials.mjs
      - name: Search, verify, deduplicate, and index materials
        run: node scripts/academics/daily-materials.mjs
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campusloop-academic-material-report
          path: academic-material-report.md
          if-no-files-found: warn
          retention-days: 45
