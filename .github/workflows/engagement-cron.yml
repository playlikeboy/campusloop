name: Engagement reminders

on:
  schedule:
    # Every 30 minutes. The endpoint decides what is due in IST and keeps quiet hours (23:00-08:00 IST).
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list who would get a reminder"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: campusloop-engagement-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configuration
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure CRON_SECRET in repository Actions secrets."
            exit 1
          fi

      - name: Call POST /api/cron/engagement
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          url="https://campusloop.space/api/cron/engagement"
          if [ "$DRY_RUN" = "1" ]; then url="$url?dryRun=1"; fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "$url" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
