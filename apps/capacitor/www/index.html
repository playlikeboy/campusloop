<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>CampusLoop</title>
    <style>
      :root {
        --loop-violet: #6b3df5;
        --loop-violet-deep: #5a2be0;
        --violet-mist: #f2edff;
        --ink: #15131d;
        --ink-muted: #57526a;
        --paper: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      }
      main { width: 100%; max-width: 360px; text-align: center; }
      .mark {
        width: 72px; height: 72px; margin: 0 auto 24px;
        border-radius: 20px; background: var(--violet-mist);
        display: flex; align-items: center; justify-content: center;
      }
      .mark svg { width: 40px; height: 42px; }
      h1 { font-size: 1.75rem; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; }
      p { font-size: 1rem; line-height: 1.5; color: var(--ink-muted); margin: 0 0 28px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        min-height: 48px; width: 100%; padding: 0 24px;
        border-radius: 999px; background: var(--loop-violet); color: var(--paper);
        font: inherit; font-size: 1rem; font-weight: 700;
      }
      button:active { background: var(--loop-violet-deep); }
      button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
      button[disabled] { opacity: 0.7; }
      .hint { margin: 16px 0 0; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="288 258 436 462" xmlns="http://www.w3.org/2000/svg"><path fill="#6b3df5" d="M 491.50 259.00 C 441.40 264.70, 395.40 286.20, 358.40 321.30 C 323.10 354.70, 298.90 400.70, 290.50 450.00 C 289.60 455.20, 288.60 467.80, 288.30 478.00 C 286.90 525.40, 299.40 569.30, 325.80 609.50 C 348.60 644.40, 378.80 671.10, 415.50 689.00 C 462.00 711.70, 513.00 718.40, 563.00 708.40 C 628.10 695.20, 682.50 653.90, 712.60 594.60 C 719.60 580.90, 723.00 572.30, 723.00 568.10 C 723.00 564.70, 718.70 558.40, 715.20 556.60 C 712.70 555.30, 687.20 547.00, 642.50 532.80 C 616.70 524.60, 618.20 524.30, 607.00 541.50 C 591.50 565.50, 565.30 583.10, 537.00 588.50 C 527.40 590.40, 508.80 590.40, 498.40 588.60 C 451.80 580.40, 417.80 543.70, 410.40 493.80 C 406.10 464.50, 414.40 433.90, 433.40 409.00 C 448.10 389.70, 467.90 376.90, 494.00 369.80 C 500.10 368.10, 504.60 367.70, 518.50 367.60 C 533.20 367.60, 536.80 367.90, 545.00 369.90 C 571.00 376.40, 593.40 390.90, 609.70 411.80 C 613.30 416.30, 617.00 420.50, 618.00 421.00 C 620.90 422.50, 628.70 422.20, 632.30 420.40 C 634.10 419.50, 646.30 412.70, 659.50 405.30 C 711.00 376.30, 710.70 376.50, 709.60 370.00 C 708.40 362.50, 690.20 339.00, 672.40 322.10 C 637.60 288.80, 595.40 268.40, 545.30 260.50 C 533.50 258.60, 502.50 257.80, 491.50 259.00 Z"/></svg>
      </div>
      <h1>You're offline</h1>
      <p>CampusLoop needs the internet to load your campus. Check your Wi-Fi or mobile data, then try again.</p>
      <button id="retry" type="button">Retry</button>
      <p class="hint" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      (function () {
        var SITE = "https://campusloop.space/";
        var button = document.getElementById("retry");
        var status = document.getElementById("status");
        var timer = null;
        function retry() {
          button.disabled = true;
          button.textContent = "Connecting…";
          status.textContent = "";
          window.location.replace(SITE);
          // Still here after a while: that attempt failed too.
          clearTimeout(timer);
          timer = setTimeout(function () {
            button.disabled = false;
            button.textContent = "Retry";
            status.textContent = "Still no connection. Try again in a moment.";
          }, 8000);
        }
        button.addEventListener("click", retry);
        window.addEventListener("online", retry);
      })();
    </script>
  </body>
</html>
