<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">How REA Works</title><desc id="d">A modern diagram showing a user agent asking REA through MCP, REA coordinating reverse-engineering tools, evidence collection, and findings returned to the agent.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f9ff"/><stop offset="1" stop-color="#edf7ff"/></linearGradient><linearGradient id="rea" x2="1" y2="1"><stop stop-color="#252d68"/><stop offset="1" stop-color="#087fbd"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#4f67ff"/><stop offset="1" stop-color="#7b4dff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#334b85" flood-opacity=".13"/></filter><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11Z" fill="#5d76ef"/></marker><marker id="greenarr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11Z" fill="#13a980"/></marker></defs>
