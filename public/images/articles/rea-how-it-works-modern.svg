<text x="70" y="90" font-size="58" font-weight="800" fill="#111b36">How <tspan fill="#4d5ef3">REA</tspan> works</text><text x="72" y="132" font-size="22" fill="#65708b">An AI agent investigates software through tools, evidence, and feedback.</text>
