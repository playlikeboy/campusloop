<rect x="520" y="350" width="500" height="120" rx="24" fill="#fff" stroke-width="4"/><rect x="520" y="350" width="500" height="120" rx="24" fill="url(#hatch)" stroke="none"/><text x="735" y="432" text-anchor="middle" font-size="66" font-weight="bold" stroke="none">REA</text><rect x="825" y="383" width="135" height="58" rx="12" fill="#fff" stroke-width="3"/><text x="892" y="421" text-anchor="middle" font-size="30" font-weight="bold" stroke="none">MCP</text>
