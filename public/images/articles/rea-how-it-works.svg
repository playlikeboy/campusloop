<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">How REA works</title><desc id="desc">An AI agent asks REA through MCP to use Hopper, Ghidra, IDA, a JavaScript analyser and a browser. The tools return evidence, which REA reports to the agent as findings.</desc>
